@if (this.title) {
  <button class="box" (click)="toggleIsActive()">
    @if (isActive) {
      <div>
        @if (this.icon) {
          <img src='{{this.icon}}' alt=""/>
        }
        <div class="is-active">{{this.title}}</div>
      </div>
    } @else {
      <div>
        @if (this.icon) {
          <img src='{{this.icon}}' alt=""/>
        }
        <div class="not-active">{{ this.title }}</div>
      </div>
    }
  </button>
}
