<div style="justify-self: center">
  <button #multiButton (click)="this.changeEntry()">
    <div (mouseover)="this.handleMouseOver($event, false)" (click)="this.handleClick($event)" class="interactionArea">
    </div>
    @if (isNext) {
      <h1 class="txt">NEXT</h1>
    }
    @if (!isNext) {
      <h1 class="txt">PREVIOUS</h1>
    }
    <div (mouseover)="this.handleMouseOver($event, true)" (click)="this.handleClick($event)" class="interactionArea">
    </div>
  </button>
</div>
